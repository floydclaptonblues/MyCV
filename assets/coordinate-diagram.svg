<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Coordinates displayed in the archived N80FP search interface</title>
<desc id="desc">Relative plot of the modeled point, last known position, and slick or debris marker shown in the archived interface screenshot.</desc>
<defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0L0 0 0 50" fill="none" stroke="#17313c" stroke-width="1"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1100" height="700" rx="28" fill="#061018"/><rect x="24" y="24" width="1052" height="652" rx="22" fill="url(#grid)" stroke="#1d4f5f"/>
<text x="60" y="70" fill="#67e8dc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26" font-weight="700">ARCHIVED INTERFACE COORDINATES</text>
<text x="60" y="102" fill="#8aa7b3" font-family="system-ui,sans-serif" font-size="16">Relative positions only — not an authoritative wreckage-location map</text>
<g transform="translate(1005,92)"><path d="M0 34L0-16M0-16L-9-2M0-16L9-2" stroke="#d8e9ee" stroke-width="3" fill="none"/><text x="-7" y="-26" fill="#d8e9ee" font-family="system-ui,sans-serif" font-size="16" font-weight="700">N</text></g>
<line x1="213.6" y1="523.8" x2="254.1" y2="201.1" stroke="#31505a" stroke-width="2" stroke-dasharray="8 8"/><rect x="191.9" y="347.5" width="84" height="28" rx="14" fill="#0b1b24" stroke="#31505a"/><text x="233.9" y="367.5" fill="#a7bdc5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13">695 m</text>
<line x1="254.1" y1="201.1" x2="461.3" y2="185.5" stroke="#31505a" stroke-width="2" stroke-dasharray="8 8"/><rect x="315.7" y="150.3" width="84" height="28" rx="14" fill="#0b1b24" stroke="#31505a"/><text x="357.7" y="170.3" fill="#a7bdc5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13">444 m</text>
<line x1="213.6" y1="523.8" x2="461.3" y2="185.5" stroke="#31505a" stroke-width="2" stroke-dasharray="8 8"/><rect x="295.4" y="339.7" width="84" height="28" rx="14" fill="#0b1b24" stroke="#31505a"/><text x="337.4" y="359.7" fill="#a7bdc5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13">896 m</text>
<rect x="200.6" y="510.8" width="26" height="26" transform="rotate(45 213.6 523.8)" fill="#f8c45c" filter="url(#glow)"/><text x="235.6" y="515.8" fill="#eef8fa" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Modeled POI</text><text x="235.6" y="539.8" fill="#9cb3bc" font-family="ui-monospace,monospace" font-size="15">30.1038, -90.0309</text>
<path d="M254.1 185.1L239.1 214.1L269.1 214.1Z" fill="#ff5f6d" filter="url(#glow)"/><text x="232.1" y="177.1" text-anchor="end" fill="#eef8fa" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Last known position</text><text x="232.1" y="201.1" text-anchor="end" fill="#9cb3bc" font-family="ui-monospace,monospace" font-size="15">30.1100, -90.0300</text>
<circle cx="461.3" cy="185.5" r="13" fill="#cc5cff" filter="url(#glow)"/><text x="483.3" y="161.5" fill="#eef8fa" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Slick / debris report</text><text x="483.3" y="185.5" fill="#9cb3bc" font-family="ui-monospace,monospace" font-size="15">30.1103, -90.0254</text>
<text x="60" y="650" fill="#6f8a94" font-family="system-ui,sans-serif" font-size="14">Distances are geodesic approximations among the three labels visible in the archived screenshot.</text></svg>